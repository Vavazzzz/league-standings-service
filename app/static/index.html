<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Standings Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-bottom: 50px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (min-width: 600px) {
            .services-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
        
        .service-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        
        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .service-card h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .service-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ League Standings Service</h1>
        <p class="subtitle">Select a service to get started</p>
        
        <div class="services-grid">
            <a href="/standings" class="service-card">
                <div class="icon">📊</div>
                <h2>Standings</h2>
                <p>View and download team standings as an image</p>
            </a>
            
            <a href="/results" class="service-card">
                <div class="icon">📋</div>
                <h2>Results</h2>
                <p>Get match results for a specific matchday</p>
            </a>
            
            <a href="/matchday" class="service-card">
                <div class="icon">🗓️</div>
                <h2>Matchday</h2>
                <p>View all matches for a specific matchday</p>
            </a>
        </div>
        
        <div class="footer">
            <p>League Standings Service v1.0</p>
        </div>
    </div>
</body>
</html>
