<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        
        .back-link a {
            color: white;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-info {
            background: #f5f5f5;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results-display {
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
            background: #f9f9f9;
            border-radius: 6px;
            padding: 20px;
            display: none;
        }
        
        .results-display.show {
            display: block;
        }
        
        .match {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .teams {
            font-weight: 600;
            color: #333;
        }
        
        .score {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        
        .match-info {
            font-size: 13px;
            color: #666;
            display: flex;
            gap: 15px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .no-results {
            text-align: center;
            color: #666;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="/">← Back</a>
    </div>
    
    <div class="container">
        <h1>📋 Results Viewer</h1>
        <p class="subtitle">View match results by matchday</p>
        
        <div class="error" id="errorMessage"></div>
        
        <form id="resultsForm">
            <div class="form-group">
                <label for="teamId">Team</label>
                <select id="teamId" name="teamId" required>
                    <option value="">-- Select a team --</option>
                    <option value="1">Team 1</option>
                    <option value="2">Team 2</option>
                </select>
                <div class="form-info">Select the team league</div>
            </div>
            
            <div class="form-group">
                <label for="matchDay">Match Day</label>
                <input 
                    type="number" 
                    id="matchDay" 
                    name="matchDay"
                    min="1"
                    placeholder="e.g., 14"
                    required
                >
                <div class="form-info">Specify matchday number</div>
            </div>
            
            <button type="submit">Get Results</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666; font-size: 14px;">Loading results...</p>
        </div>
        
        <div class="results-display" id="resultsDisplay">
            <div id="resultsList"></div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('resultsForm');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultsDisplay = document.getElementById('resultsDisplay');
        const resultsList = document.getElementById('resultsList');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teamId = document.getElementById('teamId').value;
            const matchDay = document.getElementById('matchDay').value;
            
            if (!teamId || !matchDay) {
                showError('Please fill all fields');
                return;
            }
            
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            resultsDisplay.classList.remove('show');
            form.style.opacity = '0.5';
            form.style.pointerEvents = 'none';
            
            try {
                const response = await fetch(`/data/results?match_day=${matchDay}&team_id=${teamId}`);
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const results = await response.json();
                displayResults(results);
                resultsDisplay.classList.add('show');
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                loading.style.display = 'none';
                form.style.opacity = '1';
                form.style.pointerEvents = 'auto';
            }
        });
        
        function displayResults(results) {
            if (!results || results.length === 0) {
                resultsList.innerHTML = '<div class="no-results">No results found for this matchday</div>';
                return;
            }
            
            resultsList.innerHTML = results.map(match => `
                <div class="match">
                    <div class="match-header">
                        <div class="teams">
                            ${match.home_team} vs ${match.away_team}
                        </div>
                        <div class="score">
                            ${match.home_score ?? '-'} : ${match.away_score ?? '-'}
                        </div>
                    </div>
                    <div class="match-info">
                        <span>${match.date || 'Date TBD'}</span>
                        <span>${match.time || 'Time TBD'}</span>
                    </div>
                </div>
            `).join('');
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
